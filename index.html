<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">

  <!-- ESTA LINHA ATIVA A VERSÃO MOBILE NO IPHONE -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Atelier José Pedro Lima</title>

  <!-- FONTES BROCKMANN -->
  <style>
    @font-face {
      font-family: "Brockmann";
      src: url("fonts/Brockmann-Medium.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: "Brockmann";
      src: url("fonts/Brockmann-SemiBold.otf") format("opentype");
      font-weight: 700; /* Bold, mesmo que o ficheiro se chame SemiBold */
      font-style: normal;
    }
  </style>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: "Brockmann", sans-serif;
      font-weight: 400; /* Medium */
      color: #000;
    }

    /* Top-left title */
    .top-left {
      position: fixed;
      top: 20px;
      left: 20px;
      font-family: "Brockmann", sans-serif;
      font-weight: 700; /* Bold */
      font-size: 25px; /* 1.5x */
      letter-spacing: 0.5px;
    }

    /* Centered image with equal margins (desktop) */
    .image-container {
      width: 100%;
      text-align: center;
      margin-top: 140px;
      margin-bottom: 140px;
    }

    img {
      width: 43%;   /* tamanho perfeito no desktop */
      height: auto;
      display: inline-block;
    }

    /* Bottom-left and bottom-right info */
    .bottom-left {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-family: "Brockmann", sans-serif;
      font-weight: 400; /* Medium */
      font-size: 17px; /* 1.5x */
      letter-spacing: 0.3px;
    }

    .bottom-right {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-family: "Brockmann", sans-serif;
      font-weight: 400; /* Medium */
      font-size: 17px; /* 1.5x */
      letter-spacing: 0.3px;
    }

    /* MOBILE VERSION */
    @media (max-width: 768px) {

      .top-left {
        font-size: 16px;
        top: 15px;
        left: 15px;
        font-weight: 700; /* Bold */
      }

      /* Center image vertically on mobile */
      .image-container {
        margin-top: 0;
        margin-bottom: 0;
        min-height: calc(100vh - 180px);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      img {
        width: 90%; /* imagem maior no telemóvel */
      }

      .bottom-left,
      .bottom-right {
        font-size: 12px;
        bottom: 15px;
        font-weight: 400; /* Medium */
      }
    }
  </style>
</head>

<body>

  <div class="top-left">
    Atelier José Pedro Lima
  </div>

  <div class="image-container">
    <img src="FTA_JPL_ALF_20260406_04.JPEG" alt="Atelier José Pedro Lima">
  </div>

  <div class="bottom-left">
    Coimbra, Portugal
  </div>

  <div class="bottom-right">
    info@josepedrolima.pt
  </div>

</body>
</html>
