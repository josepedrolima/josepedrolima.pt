<style>
  /* FONTES */
  @font-face {
    font-family: "IBMPlexSans";
    src: url("fonts/IBMPlexSans-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
  }

  @font-face {
    font-family: "IBMPlexSans";
    src: url("fonts/IBMPlexSans-Medium.ttf") format("truetype");
    font-weight: 500;
    font-style: normal;
  }

  body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family: "IBMPlexSans", sans-serif;
    font-weight: 500; /* Medium */
    color: #000;
  }

  /* Top-left title */
  .top-left {
    position: fixed;
    top: 20px;
    left: 20px;
    font-family: "IBMPlexSans", sans-serif;
    font-weight: 700; /* Bold */
    font-size: 20px;
    letter-spacing: 0.5px;
  }

  /* Centered image with equal margins (desktop) */
  .image-container {
    width: 100%;
    text-align: center;
    margin-top: 140px;
    margin-bottom: 140px;
  }

  img {
    width: 43%;
    height: auto;
    display: inline-block;
  }

  /* Bottom-left and bottom-right info */
  .bottom-left,
  .bottom-right {
    position: fixed;
    bottom: 20px;
    font-family: "IBMPlexSans", sans-serif;
    font-weight: 500; /* Medium */
    font-size: 14px;
    letter-spacing: 0.3px;
  }

  .bottom-left {
    left: 20px;
  }

  .bottom-right {
    right: 20px;
  }

  /* MOBILE VERSION */
  @media (max-width: 768px) {

    .top-left {
      font-size: 16px;
      top: 15px;
      left: 15px;
    }

    .image-container {
      margin-top: 0;
      margin-bottom: 0;
      min-height: calc(100vh - 180px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    img {
      width: 90%;
    }

    .bottom-left,
    .bottom-right {
      font-size: 12px;
      bottom: 15px;
    }
  }
</style>
