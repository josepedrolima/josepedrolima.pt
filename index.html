<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Atelier José Pedro Lima</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #000;
    }

    /* Top-left title */
    .top-left {
      position: fixed;
      top: 20px;
      left: 20px;
      font-weight: bold;
      font-size: 20px; /* aumentado */
      letter-spacing: 0.5px;
    }

    /* Centered image with margins */
    .image-container {
      width: 100%;
      text-align: center;
      margin-top: 140px; /* mais espaço acima */
      margin-bottom: 60px; /* margem inferior */
    }

    img {
      width: 70%; /* imagem mais pequena */
      height: auto;
      display: inline-block;
    }

    /* Bottom-left and bottom-right info */
    .bottom-left {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 14px;
      letter-spacing: 0.3px;
    }

    .bottom-right {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 14px;
      letter-spacing: 0.3px;
    }
  </style>
</head>

<body>

  <div class="top-left">
    Atelier José Pedro Lima
  </div>

  <div class="image-container">
    <img src="FTA_JPL_ALF_20260406_04.JPEG" alt="Atelier José Pedro Lima">
  </div>

  <div class="bottom-left">
    Coimbra, Portugal
  </div>

  <div class="bottom-right">
    office.josepedrolima@gmail.com
  </div>

</body>
</html>
