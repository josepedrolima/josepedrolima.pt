<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Atelier José Pedro Lima</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #000;
    }

    /* Top-left title */
    .top-left {
      position: fixed;
      top: 20px;
      left: 20px;
      font-weight: bold;
      font-size: 20px;
      letter-spacing: 0.5px;
    }

    /* Centered image with equal margins (desktop) */
    .image-container {
      width: 100%;
      text-align: center;
      margin-top: 140px;     /* igual ao topo, como pediste */
      margin-bottom: 140px;  /* igual ao topo */
    }

    img {
      width: 55%;   /* mais pequena no desktop */
      height: auto;
      display: inline-block;
    }

    /* Bottom-left and bottom-right info */
    .bottom-left {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 14px;
      letter-spacing: 0.3px;
    }

    .bottom-right {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 14px;
      letter-spacing: 0.3px;
    }

    /* MOBILE VERSION */
    @media (max-width: 768px) {

      .top-left {
        font-size: 16px;
        top: 15px;
        left: 15px;
      }

      /* Center image vertically on mobile */
      .image-container {
        margin-top: 0;
        margin-bottom: 0;
        min-height: calc(100vh - 180px); /* centração vertical perfeita */
        display: flex;
        justify-content: center;
        align-items: center;
      }

      img {
        width: 90%; /* maior no telemóvel */
