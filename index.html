<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Atelier José Pedro Lima</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #000;
    }

    /* Top-left title */
    .top-left {
      position: fixed;
      top: 20px;
      left: 20px;
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 0.5px;
    }

    /* Centered image */
    .image-container {
      width: 100%;
      max-width: 1200px;
      margin: 120px auto 20px auto;
      text-align: center;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Image credit */
    .credit {
      font-size: 12px;
      color: #555;
      margin-top: 6px;
      text-align: center;
    }

    /* Bottom-left and bottom-right info */
    .bottom-left {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 14px;
      letter-spacing: 0.3px;
    }

    .bottom-right {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 14px;
      letter-spacing: 0.3px;
    }
  </style>
</head>

<body>

  <div class="top-left">
    Atelier José Pedro Lima
  </div>

  <div class="image-container">
    <img src="FTA_JPL_ALF_20260406_04.jpg" alt="Atelier José Pedro Lima">
    <div class="credit">@Francisco Ascensão</div>
  </div>

  <div class="bottom-left">
    Coimbra, Portugal
  </div>

  <div class="bottom-right">
    office.josepedrolima@gmail.com
  </div>

</body>
</html>
